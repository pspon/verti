<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Verti Garden{% endblock %} | Verti Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        verti: { 50:'#E8F5E9', 100:'#C8E6C9', 500:'#4CAF50', 700:'#2E7D32', ink:'#2C3E2D' }
      } } }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-[#FAFAF7] text-verti-ink min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="hidden md:flex md:flex-col w-60 bg-white border-r border-verti-100 shrink-0">
      <div class="px-5 py-5 text-xl font-bold flex items-center gap-2 border-b border-verti-100">
        <span>🌿</span><span>Verti Garden</span>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        {% for item in nav %}
        <a href="{{ item.url }}"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition
                  {% if active == item.key %}bg-verti-50 text-verti-700{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
          <span class="text-lg">{{ item.icon }}</span>{{ item.label }}
        </a>
        {% endfor %}
      </nav>
      <div class="p-4 text-xs text-gray-400 border-t border-verti-100">Verti Garden Planner</div>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Mobile top bar -->
      <header class="md:hidden flex items-center justify-between bg-white border-b border-verti-100 px-4 py-3">
        <span class="font-bold flex items-center gap-2">🌿 Verti Garden</span>
        <select onchange="location.href=this.value"
                class="text-sm border border-verti-100 rounded-lg px-2 py-1">
          {% for item in nav %}
          <option value="{{ item.url }}" {% if active == item.key %}selected{% endif %}>{{ item.icon }} {{ item.label }}</option>
          {% endfor %}
        </select>
      </header>

      <main class="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
