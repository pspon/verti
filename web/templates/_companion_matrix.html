{{ matrix.matrix_html | safe }}
{% if matrix.selected | length >= 2 %}
<div class="flex flex-wrap gap-4 text-sm mt-3">
  <span class="px-2 py-1 rounded bg-verti-50 text-verti-700">✅ {{ matrix.good_count }} good pairings</span>
  <span class="px-2 py-1 rounded bg-red-50 text-red-700">⛔ {{ matrix.bad_count }} incompatible pairings</span>
</div>
{% endif %}
