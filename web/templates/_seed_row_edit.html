<tr id="seed-{{ s.id }}" class="border-b border-verti-100 bg-verti-50/50">
  <td colspan="12" class="p-3">
    <form hx-post="/database/seed/{{ s.id }}" hx-target="#seed-{{ s.id }}" hx-swap="outerHTML"
          class="grid sm:grid-cols-2 md:grid-cols-4 gap-2 text-sm">
      <input type="hidden" name="year" value="{{ year }}">
      {% include "_seed_form_fields.html" %}
      <div class="sm:col-span-2 md:col-span-4 flex gap-2 pt-1">
        <button class="bg-verti-500 hover:bg-verti-700 text-white rounded-lg px-4 py-1.5 font-medium">💾 Save</button>
        <button type="button" class="border border-verti-100 rounded-lg px-4 py-1.5 hover:bg-gray-50"
                hx-get="/database/seed/{{ s.id }}?year={{ year }}"
                hx-target="#seed-{{ s.id }}" hx-swap="outerHTML">Cancel</button>
      </div>
    </form>
  </td>
</tr>
