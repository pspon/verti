<p class="text-sm text-gray-500 mb-2"><b>{{ count }}</b> records matching filters</p>
<div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead><tr class="text-left text-gray-500 border-b border-gray-100">
      <th class="py-2 pr-4">Plant</th><th class="py-2 pr-4">Brand</th><th class="py-2 pr-4">Season</th>
      <th class="py-2 pr-4">Sun</th><th class="py-2 pr-4">Frost</th><th class="py-2 pr-4">Method</th>
      <th class="py-2 pr-4">Days</th><th class="py-2 pr-4">Per Sq</th>
      <th class="py-2 pr-4">Start</th><th class="py-2 pr-4">Sow/Transplant</th>
      <th class="py-2 pr-4">This Yr</th><th class="py-2">Actions</th>
    </tr></thead>
    <tbody id="seed-tbody">
    {% for r in records %}{% include "_seed_row.html" %}{% endfor %}
    {% if not records %}
      <tr id="no-seeds"><td colspan="12" class="py-6 text-center text-gray-500">No records match.</td></tr>
    {% endif %}
    </tbody>
  </table>
</div>
